<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a game</title>
<link rel="stylesheet" href="styles.css">
<style>
  .set-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 8px 0; border-top: 1px solid #eceef1; }
  .set-row:first-child { border-top: none; }
  .set-row strong { min-width: 50px; padding-bottom: 9px; }
  .set-row input { width: 80px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .seg { margin-bottom: 0; }
</style>
</head>
<body data-page="Report a game" data-section="rating" data-tab="report">

<main class="page">
<div class="test-banner" id="testBanner" hidden></div>
<div id="body"><section class="panel"><p class="muted">Loading…</p></section></div>
<div id="msg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
        integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
        crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { esc, rpc, showMessage } = STA;
  const $ = id => document.getElementById(id);
  let players = [], leagues = [], doubles = true, kind = 'casual', today = '';

  async function start() {
    if (!(await STA.initPage())) return;
    let mine;
    try { [mine, players, leagues] = await Promise.all([rpc('my_rating'), rpc('rating_players'), rpc('rating_leagues')]); }
    catch (err) { $('body').innerHTML = ''; showMessage($('msg'), err.message); return; }
    STA.showTestClock($('testBanner'), mine.test_mode, mine.now);
    if (mine.to_confirm.length) {
      $('body').innerHTML = `<section class="panel"><p>Other players reported ${mine.to_confirm.length === 1 ? 'a game' : 'games'}
        you played in. Please <a href="rating.html">confirm or dispute ${mine.to_confirm.length === 1 ? 'it' : 'them'} on My Rating</a> first.</p></section>`;
      return;
    }
    today = new Date(mine.now).toLocaleDateString('en-CA', { timeZone: STA.TZ });
    render();
  }

  const pick = (id, label) => `<label>${label}
    <select id="${id}"><option value="">Choose…</option>${players.map(p =>
      `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`;

  function render() {
    $('body').innerHTML = `<section class="panel">
      <p style="margin-top:0">Report a game you played with other members outside Sunday Doubles: casual play,
        or a game in a league. (Sunday Doubles games come from your Game Review, so don't report them here.)
        <strong>Every other player in the game, your partner too, is asked to confirm the score.</strong>
        It counts toward everyone's rating once they all have.</p>
      <div class="row">
        <label>Day played <input type="date" id="day" max="${today}" value="${today}"></label>
      </div>
      <div class="row" style="margin-top:12px">
        <div><div class="field-label">Singles or doubles</div>
          <div class="seg small"><button id="dblBtn" class="${doubles ? 'active' : ''}">Doubles</button><button id="sglBtn" class="${doubles ? '' : 'active'}">Singles</button></div></div>
        <div><div class="field-label">Type of game</div>
          <div class="seg small"><button id="casualBtn" class="${kind === 'casual' ? 'active' : ''}">Casual play</button><button id="leagueBtn" class="${kind === 'league' ? 'active' : ''}" ${leagues.length ? '' : 'disabled title="No leagues are set up yet"'}>League</button></div></div>
        ${kind === 'league' ? `<label>League <select id="league"><option value="">Choose…</option>${leagues.map(l =>
          `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>` : ''}
      </div>
      ${leagues.length ? '' : '<p class="muted">No leagues are set up yet. Developers add them under Developers &gt; Ratings.</p>'}
      <div class="row" style="margin-top:12px">
        ${doubles ? pick('partner', 'Your partner') : ''}
        ${pick('opp1', doubles ? 'Opponent 1' : 'Opponent')}
        ${doubles ? pick('opp2', 'Opponent 2') : ''}
      </div>
      <div class="row" style="margin-top:12px">
        <label>Number of sets <select id="setCount">${[1, 2, 3, 4, 5].map(n => `<option ${n === 2 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      </div>
      <div id="sets" style="margin-top:6px"></div>
      <div class="row" style="margin-top:12px"><button id="send">Report the game</button></div>
    </section>`;
    drawSets(2);
    // Switching singles/doubles or casual/league keeps what was already filled in.
    const redraw = change => () => {
      const kept = {};
      ['day', 'partner', 'opp1', 'opp2', 'league', 'setCount'].forEach(id => { if ($(id)) kept[id] = $(id).value; });
      const sets = [...document.querySelectorAll('.set-row')].map(r => [r.querySelector('.mine').value, r.querySelector('.theirs').value]);
      change();
      render();
      Object.entries(kept).forEach(([id, v]) => { if ($(id)) $(id).value = v; });
      drawSets(Number($('setCount').value));
      document.querySelectorAll('.set-row').forEach((r, i) => {
        if (sets[i]) { r.querySelector('.mine').value = sets[i][0]; r.querySelector('.theirs').value = sets[i][1]; }
      });
    };
    $('dblBtn').addEventListener('click', redraw(() => { doubles = true; }));
    $('sglBtn').addEventListener('click', redraw(() => { doubles = false; }));
    $('casualBtn').addEventListener('click', redraw(() => { kind = 'casual'; }));
    $('leagueBtn').addEventListener('click', redraw(() => { kind = 'league'; }));
    $('setCount').addEventListener('change', e => drawSets(Number(e.target.value)));
    $('send').addEventListener('click', send);
  }

  function drawSets(n) {
    $('sets').innerHTML = Array.from({ length: n }, (_, i) => `<div class="set-row">
      <strong>Set ${i + 1}</strong>
      <label>${doubles ? 'Games won by you and your partner' : 'Your games'} <input type="number" class="mine" min="0" max="7"></label>
      <label>${doubles ? 'Games won by your opponents' : 'Opponent\'s games'} <input type="number" class="theirs" min="0" max="7"></label>
    </div>`).join('');
  }

  async function send() {
    showMessage($('msg'), '');
    const val = id => Number($(id)?.value) || null;
    const sets = [];
    for (const [i, row] of [...document.querySelectorAll('.set-row')].entries()) {
      const a = row.querySelector('.mine').value, b = row.querySelector('.theirs').value;
      const ok = v => /^\d+$/.test(v) && Number(v) <= 7;
      if (!ok(a) || !ok(b)) { showMessage($('msg'), `Set ${i + 1}: enter the games won by each side, from 0 to 7.`); return; }
      sets.push([Number(a), Number(b)]);
    }
    const opponents = doubles ? [val('opp1'), val('opp2')] : [val('opp1')];
    if (opponents.some(x => !x) || (doubles && !val('partner'))) {
      showMessage($('msg'), doubles ? 'Choose your partner and both opponents.' : 'Choose your opponent.');
      return;
    }
    if (kind === 'league' && !val('league')) { showMessage($('msg'), 'Choose the league.'); return; }
    try {
      await rpc('report_rating_game', { p_played_on: $('day').value, p_kind: kind,
        p_league_id: kind === 'league' ? val('league') : null, p_partner: doubles ? val('partner') : null,
        p_opponents: opponents, p_sets: sets });
      render();
      $('msg').innerHTML = `<div class="msg ok">Thank you! The game was reported. The other players will be asked to confirm it.
        You can follow it on <a href="rating.html">My Rating</a>.</div>`;
    } catch (err) { showMessage($('msg'), err.message); }
  }

  start().catch(err => showMessage($('msg'), err.message));
})();
</script>
</body>
</html>
